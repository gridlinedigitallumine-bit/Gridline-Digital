<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self'; img-src 'self' data:; form-action 'none'; base-uri 'none'; object-src 'none'; frame-ancestors 'none'">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>Admin sign in | Gridline Digital</title>
<style>
:root{font-family:Montserrat,Arial,sans-serif;color:#082032;background:#f7f8f9}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px}.card{width:min(100%,440px);background:#fff;border:1px solid #e5e8eb;padding:32px;border-radius:8px;box-shadow:0 18px 50px #08203212}h1{font-size:28px;letter-spacing:-.04em;margin:0 0 8px}.lead{font-size:14px;color:#65717c;line-height:1.6;margin:0 0 24px}label{display:block;margin:16px 0 6px;font-size:13px;font-weight:600}input{width:100%;padding:12px;border:1px solid #bcc3c9;border-radius:4px;font:inherit;color:#082032}.btn{border:0;border-radius:4px;padding:13px 18px;background:#fe4c29;color:white;font:700 14px Montserrat,Arial,sans-serif;cursor:pointer;margin-top:18px}.btn:hover{background:#e83e1f}.btn:disabled{opacity:.6;cursor:wait}.status{min-height:24px;margin:16px 0 0;font-size:13px;color:#334756}.back,.forgot{display:inline-block;margin-top:20px;color:#334756;font-size:13px}.forgot{margin-top:16px;text-decoration:underline;background:none;border:0;padding:0;cursor:pointer}.back:focus-visible,.forgot:focus-visible,.btn:focus-visible,input:focus-visible{outline:3px solid #fe4c29;outline-offset:3px}[hidden]{display:none!important}
</style>
<script src="/login.js" defer></script>
</head>
<body><main class="card">
<h1 id="heading">Admin sign in</h1>
<p class="lead" id="lead">Sign in with your invited administrator account to open the dashboard.</p>
<form id="loginForm">
  <label for="email">Email address</label><input id="email" name="email" type="email" autocomplete="username" maxlength="254" required>
  <label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" maxlength="1024" required>
  <button class="btn" id="signIn" type="submit">Sign in</button>
</form>
<button class="forgot" id="forgotPassword" type="button">Forgot password?</button>
<form id="resetForm" hidden>
  <label for="newPassword">New password</label><input id="newPassword" type="password" autocomplete="new-password" minlength="12" maxlength="128" required>
  <button class="btn" id="savePassword" type="submit">Save new password</button>
</form>
<p class="status" id="status" role="status" aria-live="polite"></p>
<a class="back" href="/">Return to website</a>
</main></body></html>
