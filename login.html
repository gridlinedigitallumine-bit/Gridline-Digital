<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self'; img-src 'self' data:; base-uri 'none'; object-src 'none">
<meta name="referrer" content="no-referrer">
<title>Admin sign in | Gridline Digital</title>
<style>
:root{font-family:Montserrat,Arial,sans-serif;color:#082032;background:#f7f8f9}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px}.card{width:min(100%,440px);background:#fff;border:1px solid #e5e8eb;padding:32px;border-radius:8px;box-shadow:0 18px 50px #08203212}h1{font-size:28px;letter-spacing:-.04em;margin:0 0 8px}.lead{font-size:14px;color:#65717c;line-height:1.6;margin:0 0 24px}.btn{border:0;border-radius:4px;padding:13px 18px;background:#fe4c29;color:white;font:700 14px Montserrat,Arial,sans-serif;cursor:not-allowed;opacity:.65}.status{min-height:24px;margin:16px 0 0;font-size:13px;color:#334756}.back{display:inline-block;margin-top:20px;color:#334756;font-size:13px}.forgot{display:inline-block;margin:16px 0 0;color:#65717c;font-size:13px;text-decoration:none;background:none;border:0;padding:0;cursor:not-allowed}
</style>
<script src="/login.js" defer></script>
</head>
<body><main class="card"><h1>Admin sign in</h1><p class="lead">Administrator access is restricted to invited accounts.</p><button class="btn" id="signIn" type="button" disabled>Sign-in setup pending</button><br><button class="forgot" id="forgotPassword" type="button" disabled>Forgot password?</button><p class="status" id="status" role="status" aria-live="polite">Checking sign-in service…</p><a class="back" href="/">Return to website</a></main></body></html>
